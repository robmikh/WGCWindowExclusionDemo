name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGES_CONFIG_PATH: WGCWindowExclusionDemo\packages.config
  SOLUTION_FILE_PATH: WGCWindowExclusionDemo.slnx

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            msbuild_architecture: x64
            platform: x64
            runner: windows-2025
          - architecture: arm64
            msbuild_architecture: x64
            platform: ARM64
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: ${{ matrix.msbuild_architecture }}

      - name: Restore NuGet packages
        run: >
          nuget restore $env:PACKAGES_CONFIG_PATH
          -PackagesDirectory .\packages
          -NonInteractive

      - name: Build
        run: >
          msbuild $env:SOLUTION_FILE_PATH
          /m
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
